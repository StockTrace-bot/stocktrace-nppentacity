<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#1E293B">
    <meta name="color-scheme" content="light">
    <title>StockTrace | Login ID Pengguna</title>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
      /* Self-contained critical login styles: no Tailwind or remote stylesheet required. */
      :root {
        color-scheme: light;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #1e293b;
        background: #f8fafc;
        font-synthesis: none;
        text-rendering: optimizeLegibility;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      *, *::before, *::after { box-sizing: border-box; }
      html { min-width: 320px; min-height: 100%; background: #f8fafc; }
      body.st-login-page {
        display:flex!important;
        flex-direction:column!important;
        align-items:center!important;
        justify-content:center!important;
        width: 100%;
        min-height:100vh!important;
        min-height:100dvh!important;
        height: auto !important;
        margin: 0;
        padding: max(20px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(20px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
        overflow-x: hidden !important;
        overflow-y: auto !important;
        background: #f8fafc;
        color: #1e293b;
        font-family: inherit;
        line-height: 1.5;
      }
      .st-login-card {
        width: 100%;
        max-width: 448px;
        flex: 0 0 auto;
        margin: auto;
        padding: 32px;
        border: 1px solid #e2e8f0;
        border-radius: 22px;
        background: #ffffff;
        box-shadow: 0 12px 32px rgba(30, 41, 59, .055);
      }
      .st-login-brand { display: flex; flex-direction: column; align-items: center; gap: 14px; margin: 0 0 28px; text-align: center; }
      .st-login-mark { display: grid; width: 64px; height: 64px; place-items: center; border-radius: 17px; background: #1e293b; color: #60a5fa; }
      .st-login-mark svg { display: block; width: 30px; height: 30px; }
      .st-login-title { margin: 0; color: #1e293b; font-size: 26px; font-weight: 750; line-height: 1.2; letter-spacing: -.035em; }
      .st-login-form { display: grid; gap: 18px; margin: 0; }
      .st-login-field { display: grid; gap: 7px; min-width: 0; }
      .st-login-label { display: block; color: #334155; font-size: 14px; font-weight: 600; line-height: 1.4; }
      .st-login-input {
        display: block; width: 100%; min-width: 0; min-height: 50px; margin: 0; padding: 12px 15px;
        border: 1px solid #dbe3ef; border-radius: 11px; outline: none; background: #ffffff; color: #1e293b;
        font: inherit; font-size: 16px; line-height: 1.4; box-shadow: 0 1px 2px rgba(15, 23, 42, .025);
        transition: border-color .16s ease, box-shadow .16s ease;
      }
      .st-login-input::placeholder { color: #94a3b8; opacity: 1; }
      .st-login-input:focus { border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59, 130, 246, .14); }
      .st-login-button {
        display: flex; width: 100%; min-height: 52px; align-items: center; justify-content: center; margin: 2px 0 0; padding: 12px 18px;
        border: 1px solid #1e293b; border-radius: 11px; background: #1e293b; color: #ffffff;
        font: inherit; font-size: 15px; font-weight: 700; line-height: 1.3; cursor: pointer;
        transition: background-color .16s ease, border-color .16s ease, opacity .16s ease;
      }
      .st-login-button:hover:not(:disabled) { border-color: #334155; background: #334155; }
      .st-login-button:focus-visible { outline: 3px solid rgba(59, 130, 246, .35); outline-offset: 3px; }
      .st-login-button:disabled { cursor: wait; opacity: .62; }
      .st-login-help { margin: 0; color: #64748b; font-size: 13px; line-height: 1.5; text-align: center; }
      .st-login-status { margin: 0; padding: 12px 13px; border: 1px solid transparent; border-radius: 10px; font-size: 13px; line-height: 1.55; white-space: pre-wrap; overflow-wrap: anywhere; }
      .st-login-status[hidden] { display: none !important; }
      .st-login-status.is-error { border-color: #fecaca; background: #fef2f2; color: #991b1b; }
      .st-login-status.is-info { border-color: #bfdbfe; background: #eff6ff; color: #1e40af; }
      @media (max-width: 480px) {
        body.st-login-page { padding: max(14px, env(safe-area-inset-top)) 14px max(14px, env(safe-area-inset-bottom)); }
        .st-login-card { padding: 25px 20px; border-radius: 17px; }
        .st-login-brand { margin-bottom: 24px; }
        .st-login-title { font-size: 24px; }
      }
      @media (prefers-reduced-motion: reduce) {
        .st-login-input, .st-login-button { transition: none; }
      }
    </style>
</head>
<body class="st-login-page">
    <main class="st-login-card" aria-labelledby="loginTitle">
        <header class="st-login-brand">
            <div class="st-login-mark" aria-hidden="true">
                <svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M16 3.5 28 10.2v11.6L16 28.5 4 21.8V10.2L16 3.5Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
                    <path d="m4.5 10.5 11.5 6.6 11.5-6.6M16 17.2v10.5M10.2 7l11.7 6.8v4.5" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
                </svg>
            </div>
            <h1 id="loginTitle" class="st-login-title">StockTrace</h1>
        </header>

        <form id="loginForm" class="st-login-form">
            <div class="st-login-field">
                <label class="st-login-label" for="loginId">ID Pengguna</label>
                <input class="st-login-input" type="text" id="loginId" maxlength="12" minlength="10" pattern="NP-(LDR|STF)-[0-9]{3}" placeholder="Contoh: NP-STF-001" autocomplete="username" autocapitalize="characters" spellcheck="false" required>
            </div>
            <div class="st-login-field">
                <label class="st-login-label" for="password">Kata Sandi</label>
                <input class="st-login-input" type="password" id="password" autocomplete="current-password" required>
            </div>
            <button type="submit" id="btnLogin" class="st-login-button" disabled>Masuk</button>
            <p class="st-login-help">Lupa kata sandi? Hubungi administrator.</p>
            <p id="loginStatus" class="st-login-status" role="alert" aria-live="polite" hidden></p>
        </form>
    </main>

    <script>
    // Supabase publishable key boleh berada di frontend. Jangan gunakan service_role/secret key di sini.
    const form = document.getElementById('loginForm');
    const statusEl = document.getElementById('loginStatus');
    const btn = document.getElementById('btnLogin');
    let sb = null;
    let supabaseConfig = null;

    function showStatus(message, isError = true) {
        statusEl.textContent = message;
        statusEl.hidden = false;
        statusEl.className = isError ? 'st-login-status is-error' : 'st-login-status is-info';
    }

    async function initClient(){
      try{
        if (!window.supabase?.createClient) throw new Error('Library Supabase gagal dimuat.');
        const resp=await fetch('/api/public-config');
        const cfg=await resp.json().catch(()=>({}));
        if(!resp.ok||!cfg.supabase_url||!cfg.supabase_publishable_key)throw new Error(cfg.error||'Konfigurasi aplikasi tidak siap.');
        supabaseConfig=cfg;
        try{
          const projectRef=new URL(cfg.supabase_url).hostname.split('.')[0];
          localStorage.removeItem(`sb-${projectRef}-auth-token`);
          localStorage.removeItem('user_role');localStorage.removeItem('user_name');
        }catch(_){}
        sb=window.supabase.createClient(cfg.supabase_url,cfg.supabase_publishable_key,{
          auth:{storage:window.sessionStorage,persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}
        });
        btn.disabled=false;
      }catch(e){showStatus('Koneksi aplikasi gagal: '+e.message);btn.disabled=true;}
    }
    btn.disabled=true;
    if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',initClient,{once:true});
    else initClient();


    function safeAuthStorageSnapshot() {
        let projectRef = 'unknown';
        let expectedStorageKey = 'unknown';
        try {
            projectRef = new URL(supabaseConfig.supabase_url).hostname.split('.')[0];
            expectedStorageKey = `sb-${projectRef}-auth-token`;
        } catch (_) {}
        let storageReadable = false;
        let expectedKeyExists = false;
        let supabaseKeys = [];
        try {
            storageReadable = true;
            expectedKeyExists = sessionStorage.getItem(expectedStorageKey) !== null;
            supabaseKeys = Object.keys(sessionStorage).filter(k => k.startsWith('sb-') && k.endsWith('-auth-token'));
        } catch (_) {}
        return {
            origin: window.location.origin,
            projectRef,
            expectedStorageKey,
            storageReadable,
            expectedKeyExists,
            supabaseKeys
        };
    }

    async function showSessionTrace(stage) {
        let sessionFound = false;
        let sessionReadError = '';
        try {
            const result = await sb.auth.getSession();
            sessionFound = Boolean(result.data?.session?.access_token && result.data?.session?.refresh_token);
            sessionReadError = result.error?.message || '';
        } catch (error) {
            sessionReadError = error?.message || 'Gagal membaca sesi';
        }
        const snapshot = safeAuthStorageSnapshot();
        const detail = [
            `Tahap: ${stage}`,
            `Origin: ${snapshot.origin}`,
            `Project ref: ${snapshot.projectRef}`,
            `getSession menemukan sesi: ${sessionFound ? 'YA' : 'TIDAK'}`,
            `sessionStorage dapat dibaca: ${snapshot.storageReadable ? 'YA' : 'TIDAK'}`,
            `Storage key yang diharapkan: ${snapshot.expectedStorageKey}`,
            `Key ditemukan: ${snapshot.expectedKeyExists ? 'YA' : 'TIDAK'}`,
            `Key Supabase yang ditemukan: ${snapshot.supabaseKeys.length ? snapshot.supabaseKeys.join(', ') : 'Tidak ada'}`,
            `Detail getSession: ${sessionReadError || 'Tidak ada error'}`
        ].join('\n');
        console.info('StockTrace login session trace', {
            stage, ...snapshot, sessionFound, sessionReadError
        });
        return {sessionFound, snapshot, detail};
    }

    function explainAuthError(error) {
        const code = error?.code || '';
        const message = String(error?.message || 'Tidak diketahui');
        if (code === 'invalid_credentials' || /invalid login credentials/i.test(message)) {
            return 'ID Pengguna atau kata sandi tidak cocok.';
        }
        if (code === 'email_not_confirmed' || /email not confirmed/i.test(message)) {
            return 'Akun belum siap digunakan. Hubungi administrator sistem.';
        }
        if (code === 'over_request_rate_limit' || code === 'over_email_send_rate_limit') {
            return 'Terlalu banyak percobaan login. Coba lagi setelah batas permintaan berakhir.';
        }
        return 'Login tidak berhasil. Periksa ID Pengguna, kata sandi, atau hubungi administrator.';
    }

    form.addEventListener('submit', async function (e) {
        e.preventDefault();
        if (!sb) return showStatus('Supabase belum siap. Periksa koneksi ke CDN dan konfigurasi proyek.');
        const loginId = document.getElementById('loginId').value.trim().toUpperCase();
        const password = document.getElementById('password').value;
        btn.disabled = true;
        btn.textContent = 'Memeriksa akun...';
        statusEl.hidden = true;
        statusEl.textContent = '';

        let stage = 'auth';
        try {
            if (!/^NP-(?:LDR|STF)-\d{3}$/.test(loginId)) throw new Error('Format ID Pengguna tidak sesuai.');
            // Kata sandi dan ID ditangani oleh API login khusus; email tidak terlihat/diisi pada UI.
            const response=await fetch('/api/id-login',{
              method:'POST',headers:{'Content-Type':'application/json'},
              body:JSON.stringify({login_id:loginId,password})
            });
            const authResult=await response.json().catch(()=>({}));
            if (!response.ok||!authResult.access_token||!authResult.refresh_token) {
                throw new Error(authResult.error||'ID Pengguna atau kata sandi tidak cocok.');
            }
            const {data: authData,error: authError}=await sb.auth.setSession({
              access_token:authResult.access_token,refresh_token:authResult.refresh_token
            });
            if (authError) throw authError;
            if (!authData?.user?.id) throw new Error('Login tidak menghasilkan ID pengguna.');

            stage = 'session-persist';
            const afterSetSession = await showSessionTrace('sesudah setSession');
            if (!afterSetSession.sessionFound || !afterSetSession.snapshot.expectedKeyExists) {
                showStatus('DIAGNOSTIK: sesi belum terbukti tersimpan. Jangan lanjut ke dashboard.\n' + afterSetSession.detail);
                return;
            }

            stage = 'profile';
            showStatus('Autentikasi berhasil. Memeriksa profil dan akses pengguna...', false);
            // Tabel public.users harus punya id_user (UUID Auth), nama_lengkap, dan role.
            const {data: userData, error: userError} = await sb
                .from('users')
                .select('role, nama_lengkap')
                .eq('id_user', authData.user.id)
                .maybeSingle();
            if (userError) {
                const detail = userError.message || 'Akses profil ditolak.';
                const err = new Error('Profil gagal dibaca: ' + detail + ' (kode: ' + (userError.code || '-') + '). Periksa tabel public.users dan RLS SELECT.');
                err.cause = userError;
                throw err;
            }
            if (!userData) {
                throw new Error('Akun berhasil login ke Supabase Auth, tetapi profilnya tidak ada/tersembunyi di public.users. Periksa kecocokan auth.users.id dengan public.users.id_user dan policy RLS.');
            }
            if (!userData.role) {
                throw new Error('Profil ditemukan tetapi kolom role kosong. Atur role akun di public.users terlebih dahulu.');
            }
            // Data sessionStorage hanya untuk tampilan. Akses sebenarnya harus dijaga oleh RLS/backend.
            sessionStorage.setItem('user_role', String(userData.role));
            sessionStorage.setItem('user_name', String(userData.nama_lengkap || 'Pengguna'));
            const beforeRedirect = await showSessionTrace('tepat sebelum pindah ke dashboard');
            if (!beforeRedirect.sessionFound || !beforeRedirect.snapshot.expectedKeyExists) {
                showStatus('DIAGNOSTIK: sesi hilang sebelum dashboard dibuka.\n' + beforeRedirect.detail);
                return;
            }
            showStatus('Login berhasil dan sesi terdeteksi tersimpan. Membuka dashboard...', false);
            window.location.replace('index.html');
        } catch (error) {
            console.error('Login gagal pada tahap ' + stage, error);
            if (stage === 'profile') {
                // Hindari sesi setengah masuk ketika akun Auth belum mempunyai profil/izin yang benar.
                try { await sb.auth.signOut(); } catch (_) {}
                showStatus('Login berhasil, tetapi profil belum siap. Hubungi administrator sistem.');
            } else {
                showStatus(error?.message?.includes('Format ID')?error.message:explainAuthError(error));
            }
        } finally {
            btn.disabled = false;
            btn.textContent = 'Masuk';
        }
    });
    </script>
</body>
</html>
