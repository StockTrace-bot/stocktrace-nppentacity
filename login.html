<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#1E293B">
    <title>StockTrace | Login ID Pengguna</title>
    <link rel="preconnect" href="https://cdn.tailwindcss.com">
    <link rel="preconnect" href="https://unpkg.com">
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <script defer src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://unpkg.com/@phosphor-icons/web"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
    /* Login page: center the card in the available viewport while allowing scroll on short screens. */
    body.st-login-page{
      display:flex!important;flex-direction:column!important;align-items:center!important;justify-content:center!important;
      width:100%;min-height:100vh!important;min-height:100dvh!important;height:auto!important;
      box-sizing:border-box;padding:max(16px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) max(16px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left));
      overflow-x:hidden!important;overflow-y:auto!important;
    }
    .st-login-card{width:100%;max-width:28rem;flex:0 0 auto;margin:auto}
    #loginId,#password{font-size:16px!important;min-height:46px}
    #btnLogin{min-height:46px}
    @media(max-width:480px){.st-login-card{padding:22px 18px;margin:auto;border-radius:14px}h1{text-align:center;line-height:1.3}}
    </style>
<link rel="stylesheet" href="stocktrace-professional-rose.css">
</head>
<body class="st-login-page bg-slate-50 font-sans">
    <div class="st-login-card w-full max-w-md bg-white p-8 rounded-2xl shadow-sm border border-slate-100">
        <div class="flex flex-col items-center mb-8">
            <div class="w-12 h-12 bg-slate-900 text-blue-400 rounded-xl flex items-center justify-center mb-4">
                <i class="ph ph-package text-2xl"></i>
            </div>
            <h1 class="text-2xl font-bold text-slate-800">StockTrace</h1>
            <p class="text-sm text-slate-500 mt-1">Sistem Pelaporan & Monitoring Stok</p>
        </div>

        <form id="loginForm" class="space-y-5">
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">ID Pengguna</label>
                <input type="text" id="loginId" maxlength="12" minlength="10" pattern="NP-(LDR|STF)-[0-9]{3}" placeholder="Contoh: NP-STF-001" autocomplete="username" autocapitalize="characters" spellcheck="false" required class="w-full px-4 py-2 border border-slate-200 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none text-sm">
            </div>
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Kata Sandi</label>
                <input type="password" id="password" autocomplete="current-password" required class="w-full px-4 py-2 border border-slate-200 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none text-sm">
            </div>
            <button type="submit" id="btnLogin" class="w-full py-2.5 bg-slate-900 text-white rounded-lg text-sm font-medium hover:bg-slate-800 transition-colors mt-4">
                Masuk
            </button>
            <p class="text-center text-xs text-slate-500">Lupa kata sandi? Hubungi administrator.</p>
            <p id="loginStatus" role="alert" aria-live="polite" class="hidden mt-4 px-3 py-3 rounded-lg text-sm border"></p>
        </form>
    </div>

    <script>
    // Supabase publishable key boleh berada di frontend. Jangan gunakan service_role/secret key di sini.
    const form = document.getElementById('loginForm');
    const statusEl = document.getElementById('loginStatus');
    const btn = document.getElementById('btnLogin');
    let sb = null;
    let supabaseConfig = null;

    function showStatus(message, isError = true) {
        statusEl.textContent = message;
        statusEl.style.whiteSpace = 'pre-wrap';
        statusEl.className = isError
          ? 'mt-4 px-3 py-3 rounded-lg text-sm border border-red-200 bg-red-50 text-red-800'
          : 'mt-4 px-3 py-3 rounded-lg text-sm border border-blue-200 bg-blue-50 text-blue-900';
    }

    async function initClient(){
      try{
        if (!window.supabase?.createClient) throw new Error('Library Supabase gagal dimuat.');
        const resp=await fetch('/api/public-config');
        const cfg=await resp.json().catch(()=>({}));
        if(!resp.ok||!cfg.supabase_url||!cfg.supabase_publishable_key)throw new Error(cfg.error||'Konfigurasi aplikasi tidak siap.');
        supabaseConfig=cfg;
        try{
          const projectRef=new URL(cfg.supabase_url).hostname.split('.')[0];
          localStorage.removeItem(`sb-${projectRef}-auth-token`);
          localStorage.removeItem('user_role');localStorage.removeItem('user_name');
        }catch(_){}
        sb=window.supabase.createClient(cfg.supabase_url,cfg.supabase_publishable_key,{
          auth:{storage:window.sessionStorage,persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}
        });
        btn.disabled=false;
      }catch(e){showStatus('Koneksi aplikasi gagal: '+e.message);btn.disabled=true;}
    }
    btn.disabled=true;\n    if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',initClient,{once:true});\n    else initClient();


    function safeAuthStorageSnapshot() {
        let projectRef = 'unknown';
        let expectedStorageKey = 'unknown';
        try {
            projectRef = new URL(supabaseConfig.supabase_url).hostname.split('.')[0];
            expectedStorageKey = `sb-${projectRef}-auth-token`;
        } catch (_) {}
        let storageReadable = false;
        let expectedKeyExists = false;
        let supabaseKeys = [];
        try {
            storageReadable = true;
            expectedKeyExists = sessionStorage.getItem(expectedStorageKey) !== null;
            supabaseKeys = Object.keys(sessionStorage).filter(k => k.startsWith('sb-') && k.endsWith('-auth-token'));
        } catch (_) {}
        return {
            origin: window.location.origin,
            projectRef,
            expectedStorageKey,
            storageReadable,
            expectedKeyExists,
            supabaseKeys
        };
    }

    async function showSessionTrace(stage) {
        let sessionFound = false;
        let sessionReadError = '';
        try {
            const result = await sb.auth.getSession();
            sessionFound = Boolean(result.data?.session?.access_token && result.data?.session?.refresh_token);
            sessionReadError = result.error?.message || '';
        } catch (error) {
            sessionReadError = error?.message || 'Gagal membaca sesi';
        }
        const snapshot = safeAuthStorageSnapshot();
        const detail = [
            `Tahap: ${stage}`,
            `Origin: ${snapshot.origin}`,
            `Project ref: ${snapshot.projectRef}`,
            `getSession menemukan sesi: ${sessionFound ? 'YA' : 'TIDAK'}`,
            `sessionStorage dapat dibaca: ${snapshot.storageReadable ? 'YA' : 'TIDAK'}`,
            `Storage key yang diharapkan: ${snapshot.expectedStorageKey}`,
            `Key ditemukan: ${snapshot.expectedKeyExists ? 'YA' : 'TIDAK'}`,
            `Key Supabase yang ditemukan: ${snapshot.supabaseKeys.length ? snapshot.supabaseKeys.join(', ') : 'Tidak ada'}`,
            `Detail getSession: ${sessionReadError || 'Tidak ada error'}`
        ].join('\n');
        console.info('StockTrace login session trace', {
            stage, ...snapshot, sessionFound, sessionReadError
        });
        return {sessionFound, snapshot, detail};
    }

    function explainAuthError(error) {
        const code = error?.code || '';
        const message = String(error?.message || 'Tidak diketahui');
        if (code === 'invalid_credentials' || /invalid login credentials/i.test(message)) {
            return 'ID Pengguna atau kata sandi tidak cocok.';
        }
        if (code === 'email_not_confirmed' || /email not confirmed/i.test(message)) {
            return 'Akun belum siap digunakan. Hubungi administrator sistem.';
        }
        if (code === 'over_request_rate_limit' || code === 'over_email_send_rate_limit') {
            return 'Terlalu banyak percobaan login. Coba lagi setelah batas permintaan berakhir.';
        }
        return 'Login tidak berhasil. Periksa ID Pengguna, kata sandi, atau hubungi administrator.';
    }

    form.addEventListener('submit', async function (e) {
        e.preventDefault();
        if (!sb) return showStatus('Supabase belum siap. Periksa koneksi ke CDN dan konfigurasi proyek.');
        const loginId = document.getElementById('loginId').value.trim().toUpperCase();
        const password = document.getElementById('password').value;
        btn.disabled = true;
        btn.textContent = 'Memeriksa akun...';
        statusEl.classList.add('hidden');

        let stage = 'auth';
        try {
            if (!/^NP-(?:LDR|STF)-\d{3}$/.test(loginId)) throw new Error('Format ID Pengguna tidak sesuai.');
            // Kata sandi dan ID ditangani oleh API login khusus; email tidak terlihat/diisi pada UI.
            const response=await fetch('/api/id-login',{
              method:'POST',headers:{'Content-Type':'application/json'},
              body:JSON.stringify({login_id:loginId,password})
            });
            const authResult=await response.json().catch(()=>({}));
            if (!response.ok||!authResult.access_token||!authResult.refresh_token) {
                throw new Error(authResult.error||'ID Pengguna atau kata sandi tidak cocok.');
            }
            const {data: authData,error: authError}=await sb.auth.setSession({
              access_token:authResult.access_token,refresh_token:authResult.refresh_token
            });
            if (authError) throw authError;
            if (!authData?.user?.id) throw new Error('Login tidak menghasilkan ID pengguna.');

            stage = 'session-persist';
            const afterSetSession = await showSessionTrace('sesudah setSession');
            if (!afterSetSession.sessionFound || !afterSetSession.snapshot.expectedKeyExists) {
                showStatus('DIAGNOSTIK: sesi belum terbukti tersimpan. Jangan lanjut ke dashboard.\n' + afterSetSession.detail);
                return;
            }

            stage = 'profile';
            showStatus('Autentikasi berhasil. Memeriksa profil dan akses pengguna...', false);
            // Tabel public.users harus punya id_user (UUID Auth), nama_lengkap, dan role.
            const {data: userData, error: userError} = await sb
                .from('users')
                .select('role, nama_lengkap')
                .eq('id_user', authData.user.id)
                .maybeSingle();
            if (userError) {
                const detail = userError.message || 'Akses profil ditolak.';
                const err = new Error('Profil gagal dibaca: ' + detail + ' (kode: ' + (userError.code || '-') + '). Periksa tabel public.users dan RLS SELECT.');
                err.cause = userError;
                throw err;
            }
            if (!userData) {
                throw new Error('Akun berhasil login ke Supabase Auth, tetapi profilnya tidak ada/tersembunyi di public.users. Periksa kecocokan auth.users.id dengan public.users.id_user dan policy RLS.');
            }
            if (!userData.role) {
                throw new Error('Profil ditemukan tetapi kolom role kosong. Atur role akun di public.users terlebih dahulu.');
            }
            // Data sessionStorage hanya untuk tampilan. Akses sebenarnya harus dijaga oleh RLS/backend.
            sessionStorage.setItem('user_role', String(userData.role));
            sessionStorage.setItem('user_name', String(userData.nama_lengkap || 'Pengguna'));
            const beforeRedirect = await showSessionTrace('tepat sebelum pindah ke dashboard');
            if (!beforeRedirect.sessionFound || !beforeRedirect.snapshot.expectedKeyExists) {
                showStatus('DIAGNOSTIK: sesi hilang sebelum dashboard dibuka.\n' + beforeRedirect.detail);
                return;
            }
            showStatus('Login berhasil dan sesi terdeteksi tersimpan. Membuka dashboard...', false);
            window.location.replace('index.html');
        } catch (error) {
            console.error('Login gagal pada tahap ' + stage, error);
            if (stage === 'profile') {
                // Hindari sesi setengah masuk ketika akun Auth belum mempunyai profil/izin yang benar.
                try { await sb.auth.signOut(); } catch (_) {}
                showStatus('Login berhasil, tetapi profil belum siap. Hubungi administrator sistem.');
            } else {
                showStatus(error?.message?.includes('Format ID')?error.message:explainAuthError(error));
            }
        } finally {
            btn.disabled = false;
            btn.textContent = 'Masuk';
        }
    });
    </script>
</body>
</html>
