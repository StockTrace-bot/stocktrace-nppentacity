<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - StockTrace Nada Puspita</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-50 flex items-center justify-center h-screen font-sans">
    <div class="w-full max-w-md bg-white p-8 rounded-2xl shadow-sm border border-slate-100">
        <div class="flex flex-col items-center mb-8">
            <div class="w-12 h-12 bg-slate-900 text-blue-400 rounded-xl flex items-center justify-center mb-4">
                <i class="ph ph-package text-2xl"></i>
            </div>
            <h1 class="text-2xl font-bold text-slate-800">Masuk ke StockTrace</h1>
            <p class="text-sm text-slate-500 mt-1">Sistem Pendukung Audit Internal</p>
        </div>

        <form id="loginForm" class="space-y-5">
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Email Karyawan</label>
                <input type="email" id="email" required class="w-full px-4 py-2 border border-slate-200 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none text-sm">
            </div>
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Kata Sandi</label>
                <input type="password" id="password" required class="w-full px-4 py-2 border border-slate-200 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none text-sm">
            </div>
            <button type="submit" id="btnLogin" class="w-full py-2.5 bg-slate-900 text-white rounded-lg text-sm font-medium hover:bg-slate-800 transition-colors mt-4">
                Masuk
            </button>
        </form>
    </div>

    <script>
        // GANTI URL DAN KEY SUPABASE MILIKMU DI SINI
        const SUPABASE_URL = 'https://tcwkfsrxjujsuyttxgfz.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_PlaYZ1SsTeoCiF4FefE-Eg_w1s2uIum';
        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const btn = document.getElementById('btnLogin');
            btn.innerText = 'Memeriksa kredensial...';
            btn.disabled = true;

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            try {
                const { data: authData, error: authError } = await supabase.auth.signInWithPassword({ email, password });
                if (authError) throw authError;

                const { data: userData, error: userError } = await supabase
                    .from('users').select('role, nama_lengkap').eq('id_user', authData.user.id).single();
                
                if (userError) throw userError;

                localStorage.setItem('user_role', userData.role);
                localStorage.setItem('user_name', userData.nama_lengkap);
                window.location.href = 'index.html';

            } catch (error) {
                Swal.fire({ title: 'Gagal Masuk', text: 'Email atau kata sandi salah.', icon: 'error', confirmButtonColor: '#1E293B' });
                btn.innerText = 'Masuk';
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
